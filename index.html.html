                  </div>
                )}

                {currentView === 'PUBLIC' && publicTab === 'TEACHERS' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-cyan-400">{siteTexts.teachersTitle}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {personnel.map(p => (
                        <div key={p.id} className="bg-[#1c2541] border border-[#3a506b] p-4 rounded-2xl flex items-center gap-3">
                          <img src={p.photo} alt={p.name} className="w-12 h-12 rounded-xl object-cover" />
                          <div>
                            <h4 className="font-bold text-xs text-white">{p.name}</h4>
                            <p className="text-[10px] text-cyan-400">{p.position}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {currentView === 'PUBLIC' && (publicTab === 'STAFF' || publicTab === 'STUDENTS') && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-cyan-400">{publicTab === 'STAFF' ? siteTexts.staffTitle : siteTexts.studentTitle}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {(publicTab === 'STAFF' ? STAFF_ROOMS : STUDENT_ROOMS).map(room => (
                        <div key={room} className="bg-[#1c2541] border border-[#3a506b] p-4 rounded-2xl space-y-2 text-center">
                          <h3 className="font-black text-white">ห้อง {room}</h3>
                          <img src={roomImages['ม.5/1']} alt="room" className="w-full h-32 object-cover rounded-xl" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {currentView === 'PUBLIC' && publicTab === 'GALLERY' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-cyan-400">{siteTexts.galleryTitle}</h2>
                    <p className="text-xs text-slate-300">{siteTexts.gallerySub}</p>
                    {gallery.map(g => (
                      <div key={g.id} className="bg-[#1c2541] border border-[#3a506b] p-4 rounded-2xl space-y-3">
                        <h3 className="font-bold text-white text-sm">{g.title}</h3>
                        <div className="grid grid-cols-2 gap-3">
                          {g.photos.map((p, idx) => (
                            <img key={idx} src={p.url} alt="pic" className="w-full h-36 object-cover rounded-xl" />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {currentView === 'PUBLIC' && publicTab === 'SUMMARY' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-orange-400">📊 สรุปผลการแข่งขัน & รายงาน</h2>
                    <p className="text-xs text-slate-300">รวบรวมข้อมูลและสถิติกีฬาสีประจำปี 2026 สมบูรณ์แบบ</p>
                  </div>
                )}

                {currentView === 'ADMIN' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-orange-400">แผงควบคุมเจ้าหน้าที่ (Admin Control Panel)</h2>
                    <p className="text-xs text-slate-300">จัดการข้อมูลการแข่งขัน ภาพกิจกรรม คณะครู Staff นักเรียน และตั้งค่าหน้าเว็บได้ที่นี่</p>
                  </div>
                )}
              </main>
            </div>
          )}

          {/* LOGIN MODAL (NO PASSWORD DISPLAYED) */}
          {loginModalOpen && (
            <div className="fixed inset-0 bg-[#0b132b]/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-[#1c2541] border border-[#3a506b] p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl relative">
                <button onClick={() => setLoginModalOpen(false)} className="absolute top-4 right-4 text-slate-300 hover:text-white"><X className="w-5 h-5" /></button>
                <div className="flex items-center gap-2">
                  <div className="p-2 bg-orange-500/10 text-orange-400 rounded-xl"><Lock className="w-5 h-5" /></div>
                  <h3 className="text-lg font-black text-white">เข้าสู่ระบบเจ้าหน้าที่</h3>
                </div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">รหัสผ่าน PIN</label>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder="กรอกรหัสผ่าน PIN..."
                      className="w-full bg-[#0b132b] border border-[#3a506b] rounded-xl p-3 text-center text-lg font-bold text-white tracking-widest focus:border-orange-400 focus:outline-none"
                    />
                  </div>
                  {loginError && <p className="text-xs text-rose-400 font-semibold text-center">{loginError}</p>}
                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-black rounded-xl text-xs shadow-lg transition cursor-pointer">
                    ยืนยันเข้าสู่ระบบ
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
